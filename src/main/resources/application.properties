spring.application.name=portfolio-service

spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=1s

app.valkey.startup-gate.enabled=true
app.valkey.startup-gate.retry-interval=1s
shared.lock.lease-duration=30s
shared.lock.renewal-interval=10s
shared.lock.wait-timeout=10s
shared.lock.retry-interval=50ms
