services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEON_DB_URL: jdbc:postgresql://postgres:5432/portfolio
      NEON_DB_USERNAME: portfolio
      NEON_DB_PASSWORD: portfolio
    ports:
      - "8080:8080"

volumes:
  postgres-data:
